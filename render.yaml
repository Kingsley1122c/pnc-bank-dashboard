services:
  - type: web
    name: pnc-bank-dashboard
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /api/health
    domains:
      - nevoracore.com
    renderSubdomainPolicy: enabled
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://nevoracore.com
      - key: ALLOWED_ORIGINS
        value: https://nevoracore.com,https://www.nevoracore.com
      - key: EMAIL_MODE
        value: disabled
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_FROM_NAME
        value: Nevora Core
      - key: EMAIL_TEST_RECIPIENT
        sync: false
      - key: EMAIL_SEND_AFTER
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: VITE_API_BASE_URL
        value: ""
    disk:
      name: pnc-bank-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1